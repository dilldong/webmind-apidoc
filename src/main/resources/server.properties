server = tomcat
server.contextPath =
server.port = 10030
server.minThreads = 3
server.maxThreads = 20
server.maxConnections = 100
server.connectionTimeout = 10000

# \u9759\u6001\u8D44\u6E90\u76EE\u5F55
server.resourceDirectory = static

# \u9759\u6001\u8D44\u6E90\u6839\u4E0B\u7684\u6587\u4EF6, \u5982robots.txt, sitemap.xml
server.resourceRootFiles = static/robots.txt, static/favicon.ico

# \u9759\u6001\u8D44\u6E90\u6D4F\u89C8\u5668\u7F13\u5B58\u8BBE\u7F6E ,\u4E0D\u7F13\u5B58\u53EF\u4EE5\u8BBE\u7F6E-1,\u5355\u4F4D:\u79D2
server.resourceExpires = 1800

# \u9650\u5236\u4E86HTTP \u8BF7\u6C42\u4E2D\u7684\u53C2\u6570\u6570\u91CF\uFF08\u8BA1\u6570\u89C4\u5219: \u8BF7\u6C42body\u4E2D\u3001URL\u67E5\u8BE2\u53C2\u6570\uFF09\uFF0C\u9ED8\u8BA410000
# \u5982\u679C\u4F7F\u7528\u4E86servlet3.0\u4E0A\u4F20\u6587\u4EF6\uFF0C\u90A3\u4E48\u6B64\u53C2\u6570\u8FD8\u5C06\u9650\u5236\u4E0A\u4F20\u6587\u4EF6\u7684\u6570\u91CF
server.maxParameterCount = 100